name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # CI runs the same file the agent runs. Never list the checks here —
      # that is what stops local green and CI green from drifting apart.
      - run: ./scripts/verify.sh
